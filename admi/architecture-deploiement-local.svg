<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050" role="img" aria-labelledby="title desc">
<title id="title">E-SOURCE — Architecture de déploiement local</title>
<desc id="desc">Architecture locale : navigateur administrateur, Apache, frontend et API PHP, base MySQL, outils XAMPP et espace de travail GitHub dans le dossier admi.</desc>
